# Builds and signs Android + Windows when you push a version tag.
# Example:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Private repo: signing values are hardcoded below (no GitHub Actions secrets).
# Paste your real values into SIGNING_* env vars.
# For the keystore, either:
#   A) put base64 into ANDROID_KEYSTORE_BASE64, or
#   B) commit the file at ci/release/upload-keystore.jks

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must ship Dart >= 3.13.4 (see pubspec environment.sdk)
  FLUTTER_VERSION: "3.47.7"

  # ─── HARDCODED SIGNING (private repo) ───────────────────────────
  # Generated keystore also committed at ci/release/upload-keystore.jks
  ANDROID_KEYSTORE_BASE64: ""
  ANDROID_KEYSTORE_PASSWORD: "MarefatRelease!2026"
  ANDROID_KEY_ALIAS: "marefat"
  ANDROID_KEY_PASSWORD: "MarefatRelease!2026"

  # Windows Authenticode (self-signed; also at ci/release/windows.pfx)
  WINDOWS_CERTIFICATE_BASE64: ""
  WINDOWS_CERTIFICATE_PASSWORD: "MarefatRelease!2026"
  # ────────────────────────────────────────────────────────────────

jobs:
  android:
    name: Android (signed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Android $VERSION (run ${GITHUB_RUN_NUMBER})"

      - name: Prepare Android signing
        run: |
          set -euo pipefail
          DEST="android/app/upload-keystore.jks"

          if [ -f "ci/release/upload-keystore.jks" ]; then
            cp "ci/release/upload-keystore.jks" "$DEST"
            echo "Using committed keystore: ci/release/upload-keystore.jks"
          elif [ -n "${{ env.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ env.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$DEST"
            echo "Using ANDROID_KEYSTORE_BASE64 from workflow env"
          else
            echo "::error::No keystore. Set ANDROID_KEYSTORE_BASE64 in release.yml or add ci/release/upload-keystore.jks"
            exit 1
          fi


          {
            echo "storePassword=${{ env.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ env.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ env.ANDROID_KEY_ALIAS }}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "Wrote android/key.properties"

      - name: Flutter pub get
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | flutter doctor --android-licenses >/tmp/android-licenses.log 2>&1 || true
          # Also accept via sdkmanager when available (covers NDK packages)
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/tmp/sdkmanager-licenses.log 2>&1 || true
          elif [ -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses \
              >/tmp/sdkmanager-licenses.log 2>&1 || true
          fi
          echo "Android licenses accepted (best-effort)"

      - name: Build signed APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Build signed App Bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.ver.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Collect Android artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/android/marefat-${{ steps.ver.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/android/marefat-${{ steps.ver.outputs.version }}.aab"
          ls -lh dist/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/android/*
          if-no-files-found: error

  windows:
    name: Windows (release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: >
          flutter build windows --release
          --build-name=${{ steps.ver.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Sign Windows executable (optional)
        shell: pwsh
        run: |
          $pfxPath = $null

          if (Test-Path "ci\release\windows.pfx") {
            $pfxPath = "ci\release\windows.pfx"
            Write-Host "Using committed PFX: ci/release/windows.pfx"
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ env.WINDOWS_CERTIFICATE_BASE64 }}")) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String("${{ env.WINDOWS_CERTIFICATE_BASE64 }}")
            )
            Write-Host "Using WINDOWS_CERTIFICATE_BASE64 from workflow env"
          } else {
            Write-Host "No Windows certificate configured — shipping unsigned build."
            exit 0
          }

          $password = "${{ env.WINDOWS_CERTIFICATE_PASSWORD }}"

          $releaseDir = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows exe not found in $releaseDir" }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1

          if (-not $signtool) { throw "signtool.exe not found" }

          & $signtool.FullName sign `
            /f $pfxPath `
            /p $password `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $exe.FullName

          Write-Host "Signed $($exe.FullName)"

      - name: Package Windows zip
        shell: bash
        run: |
          mkdir -p dist/windows
          VERSION="${{ steps.ver.outputs.version }}"
          RELEASE_DIR="build/windows/x64/runner/Release"
          ZIP_PATH="dist/windows/marefat-${VERSION}-windows-x64.zip"
          powershell -NoProfile -Command \
            "Compress-Archive -Path '${RELEASE_DIR}\\*' -DestinationPath '${ZIP_PATH}' -Force"
          ls -lh dist/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: معرفت ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/android/*
            dist/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
